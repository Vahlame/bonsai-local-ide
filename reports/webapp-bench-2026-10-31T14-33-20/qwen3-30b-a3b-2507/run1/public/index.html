<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>TaskBoard</h1>
    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addTaskBtn">Add</button>
    </div>

    <div class="stats">
      <div class="stat-item">
        <span class="label">Todo</span>
        <span class="value" id="todoCount">0</span>
      </div>
      <div class="stat-item">
        <span class="label">Doing</span>
        <span class="value" id="doingCount">0</span>
      </div>
      <div class="stat-item">
        <span class="label">Done</span>
        <span class="value" id="doneCount">0</span>
      </div>
      <div class="stat-item total">
        <span class="label">Total</span>
        <span class="value" id="totalCount">0</span>
      </div>
    </div>

    <div class="board">
      <div class="column">
        <h2>Todo</h2>
        <ul id="todoList"></ul>
      </div>
      <div class="column">
        <h2>Doing</h2>
        <ul id="doingList"></ul>
      </div>
      <div class="column">
        <h2>Done</h2>
        <ul id="doneList"></ul>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
