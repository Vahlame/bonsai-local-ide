<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Taskboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Taskboard</h1>
  <div id="add-task">
    <input type="text" id="new-task-title" placeholder="Nueva tarea" />
    <button id="add-task-btn">Añadir</button>
  </div>
  <div id="board">
    <div class="column" id="todo-column">
      <h2>Todo</h2>
      <ul id="todo-list"></ul>
    </div>
    <div class="column" id="doing-column">
      <h2>Doing</h2>
      <ul id="doing-list"></ul>
    </div>
    <div class="column" id="done-column">
      <h2>Done</h2>
      <ul id="done-list"></ul>
    </div>
  </div>
  <div id="stats">
    <h2>Estadísticas</h2>
    <p id="stats-content"></p>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
