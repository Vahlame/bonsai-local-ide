name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Artefacto, SBOM y release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chat/package-lock.json

      - name: Dependencias
        run: npm ci --prefix chat

      - name: Auditoría de dependencias
        run: npm audit --prefix chat --omit=dev

      - name: Verificación antes de publicar
        run: |
          node scripts/check-syntax.mjs
          node scripts/audit-code.mjs --strict
          node scripts/run-tests.mjs

      - name: SBOM CycloneDX
        shell: pwsh
        run: |
          npm sbom --prefix chat --sbom-format cyclonedx --omit dev | Out-File -Encoding utf8 sbom.cdx.json

      - name: Paquete de código (runtime y modelos aparte)
        shell: pwsh
        run: |
          $destino = "dist/bonsai-local-ide-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force "dist" | Out-Null
          New-Item -ItemType Directory -Force $destino | Out-Null
          $excluir = @(".git", "models", "logs", "reports", "undo", "ui-chats", "agent-traces",
            "salida", "capturas", "trabajo", "bin", "node_modules", "dist", ".venv")
          $robocopy = Get-Command robocopy
          $argumentos = @(".", $destino, "/E", "/NFL", "/NDL", "/NJH", "/NJS", "/NP",
            "/XD") + $excluir + @("/XF", "*.gguf", "*.part")
          & $robocopy.Source @argumentos | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy falló: $LASTEXITCODE" }
          Copy-Item sbom.cdx.json $destino
          Compress-Archive -Path "$destino/*" -DestinationPath "dist/bonsai-local-ide-${{ github.ref_name }}.zip" -Force
          Get-FileHash "dist/bonsai-local-ide-${{ github.ref_name }}.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  bonsai-local-ide-${{ github.ref_name }}.zip" } |
            Out-File -Encoding utf8 "dist/bonsai-local-ide-${{ github.ref_name }}.zip.sha256"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/bonsai-local-ide-${{ github.ref_name }}.zip
            dist/bonsai-local-ide-${{ github.ref_name }}.zip.sha256
            sbom.cdx.json
