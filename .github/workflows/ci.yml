name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests aislados y documentación
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chat/package-lock.json

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del IDE
        run: npm ci --prefix chat

      - name: Enlaces de documentación
        run: node scripts/check-doc-links.mjs

      - name: Tests aislados
        run: node scripts/run-tests.mjs
