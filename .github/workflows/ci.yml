name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests aislados y documentación
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chat/package-lock.json

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencias del IDE
        run: npm ci --prefix chat

      - name: Enlaces de documentación
        run: node scripts/check-doc-links.mjs

      - name: Vulnerabilidades de dependencias
        run: npm audit --prefix chat --omit=dev

      - name: Auditoría estructural
        run: node scripts/audit-code.mjs --strict

      - name: Sintaxis de todo el código
        run: node scripts/check-syntax.mjs

      - name: Tipos de los módulos de frontera (gradual)
        run: node chat/node_modules/typescript/bin/tsc -p tsconfig.check.json

      - name: Lint de los módulos de frontera
        run: node chat/node_modules/eslint/bin/eslint.js chat/rutas-sensibles.mjs chat/retencion.mjs chat/red-segura.mjs chat/server/security-headers.mjs chat/server/observability.mjs

      - name: Informes curados (sin ejecuciones crudas)
        run: node scripts/check-reports.mjs

      - name: Tests aislados con cobertura
        run: npm run coverage

  browser-smoke:
    name: Suites de navegador (UI, sin GPU)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chat/package-lock.json

      - name: Dependencias del IDE
        run: npm ci --prefix chat

      - name: Suites de interfaz con Edge/Chrome del runner
        shell: pwsh
        run: node scripts/run-tests.mjs navegador
