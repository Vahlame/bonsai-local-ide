<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Benchmark pipeline">
<rect width="1000" height="380" fill="#ffffff"/>
<text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17212b" text-anchor="start">Pipeline del benchmark</text>
<text x="24" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6773" text-anchor="start">Aislamiento por modelo y tarea · pensamiento libre · verificación real en navegador</text>
<rect x="30" y="130" width="138" height="92" fill="#ffffff" stroke="#2f7d32" stroke-width="2" rx="10"/>
<text x="99.0" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#17212b" text-anchor="middle">Prompt</text>
<text x="99.0" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">4 tareas</text>
<line x1="168" y1="176" x2="190" y2="176" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
<rect x="190" y="130" width="138" height="92" fill="#ffffff" stroke="#2563eb" stroke-width="2" rx="10"/>
<text x="259.0" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#17212b" text-anchor="middle">Model switch</text>
<text x="259.0" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">API + lifecycle</text>
<line x1="328" y1="176" x2="350" y2="176" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
<rect x="350" y="130" width="138" height="92" fill="#ffffff" stroke="#d97706" stroke-width="2" rx="10"/>
<text x="419.0" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#17212b" text-anchor="middle">Agente</text>
<text x="419.0" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">tools + workspace</text>
<line x1="488" y1="176" x2="510" y2="176" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
<rect x="510" y="130" width="138" height="92" fill="#ffffff" stroke="#2f7d32" stroke-width="2" rx="10"/>
<text x="579.0" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#17212b" text-anchor="middle">HTML</text>
<text x="579.0" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">index.html</text>
<line x1="648" y1="176" x2="670" y2="176" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
<rect x="670" y="130" width="138" height="92" fill="#ffffff" stroke="#2563eb" stroke-width="2" rx="10"/>
<text x="739.0" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#17212b" text-anchor="middle">Checker</text>
<text x="739.0" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">Edge headless</text>
<line x1="808" y1="176" x2="830" y2="176" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
<rect x="830" y="130" width="138" height="92" fill="#ffffff" stroke="#2f7d32" stroke-width="2" rx="10"/>
<text x="899.0" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#17212b" text-anchor="middle">Score</text>
<text x="899.0" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">JSON + captura</text>
<defs><marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker></defs>
<text x="24" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="start">Cada tarea escribe en trabajo/bench-tasks/&lt;tarea&gt;/&lt;modelo&gt;/ y se evalúa sin ejecutar código del modelo fuera del navegador.</text>
</svg>
