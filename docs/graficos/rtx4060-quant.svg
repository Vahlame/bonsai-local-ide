<text x="798.0" y="435.2" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#17212b" text-anchor="middle">+1.72%</text>
<text x="798.0" y="490.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">Q5_K_M</text>
<rect x="842.0" y="425.5" width="40.0" height="44.5" fill="#d97706" rx="4"/>
<text x="862.0" y="418.5" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#17212b" text-anchor="middle">+2.75%</text>
<text x="862.0" y="490.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">Q4_K_M</text>
<rect x="906.0" y="220.0" width="40.0" height="250.0" fill="#c2410c" rx="4"/>
<text x="926.0" y="213.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#17212b" text-anchor="middle">+15.44%</text>
<text x="926.0" y="490.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">Q3_K_M</text>
<text x="24.0" y="525.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6773" text-anchor="start">Q6_K is the quality-first choice (+0.32% PPL, 65.5 tok/s). Q4_K_M is the balanced choice (+2.75%, 81.9 tok/s).</text>
<text x="24.0" y="543.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6773" text-anchor="start">Q3_K_M costs +15.4% PPL for 90.8 tok/s; this is a speed-only profile, not a quality recommendation.</text>
</svg>