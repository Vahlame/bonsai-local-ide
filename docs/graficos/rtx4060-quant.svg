<text x="402.0" y="206.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="middle">81.9</text>
<text x="402.0" y="488.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">Q4_K_M</text>
<text x="402.0" y="503.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">2.33 GiB</text>
