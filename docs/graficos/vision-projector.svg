<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="920" height="400" fill="#0d100b"/>
  <text x="24" y="34" fill="#e9eee0" font-size="18" font-weight="600">Por qué q8_0 + visión pasa de 71k a 110k</text>
  <text x="24" y="54" fill="#8d9680" font-size="12">El proyector de visión pesa 879 MiB. En VRAM limita la ventana; en RAM no. La visión sigue funcionando en ambos.</text>

  <!-- Card A: GPU projector -->
  <rect x="30" y="80" width="390" height="240" rx="10" fill="#12160f" stroke="#2c3326"/>
  <text x="50" y="110" fill="#e9eee0" font-size="14" font-weight="700">Proyector en GPU</text>
  <text x="50" y="130" fill="#8d9680" font-size="11">--mmproj-offload --mmproj-device CUDA0</text>

  <!-- VRAM bar 8,188 MiB total, 0.0366 px per MiB over 300px -->
  <text x="50" y="160" fill="#8d9680" font-size="10">VRAM 8.188 MiB</text>
  <rect x="50" y="170" width="300" height="22" rx="3" fill="#1a2014"/>
  <rect x="50" y="170" width="178" height="22" fill="#4d5a3f"/>
  <rect x="228" y="170" width="32" height="22" fill="#e8c06a"/>
  <rect x="260" y="170" width="90" height="22" fill="#3a4332"/>
  <text x="50" y="210" fill="#8d9680" font-size="10">pesos + KV</text>
  <text x="228" y="210" fill="#e8c06a" font-size="10">proyector 879</text>
  <text x="300" y="210" fill="#8d9680" font-size="10">buffers</text>

  <text x="50" y="248" fill="#e9eee0" font-size="12">Techo: <tspan font-weight="700">71.680 tokens</tspan></text>
  <text x="50" y="270" fill="#e9eee0" font-size="12">Imagen: <tspan fill="#cde86e" font-weight="700">~2 s</tspan></text>
  <text x="50" y="292" fill="#8d9680" font-size="11">Pico medido: 7.543 MiB · 414 MiB libres</text>

  <!-- Arrow -->
  <path d="M440 200 L480 200" stroke="#cde86e" stroke-width="3"/>
  <path d="M474 192 L486 200 L474 208" fill="#cde86e"/>
  <text x="432" y="186" fill="#cde86e" font-size="10" text-anchor="middle">879 MiB</text>
  <text x="432" y="226" fill="#8d9680" font-size="10" text-anchor="middle">a RAM</text>

  <!-- Card B: CPU projector -->
  <rect x="500" y="80" width="390" height="240" rx="10" fill="#12160f" stroke="#cde86e"/>
  <text x="520" y="110" fill="#e9eee0" font-size="14" font-weight="700">Proyector en CPU ★</text>
  <text x="520" y="130" fill="#8d9680" font-size="11">--no-mmproj-offload</text>

  <text x="520" y="160" fill="#8d9680" font-size="10">VRAM 8.188 MiB</text>
  <rect x="520" y="170" width="300" height="22" rx="3" fill="#1a2014"/>
  <rect x="520" y="170" width="205" height="22" fill="#4d5a3f"/>
  <rect x="725" y="170" width="70" height="22" fill="#3a4332"/>
  <text x="520" y="210" fill="#8d9680" font-size="10">pesos + KV q8_0 (más ventana)</text>
  <text x="740" y="210" fill="#8d9680" font-size="10">buffers</text>

  <text x="520" y="248" fill="#e9eee0" font-size="12">Techo: <tspan font-weight="700">110.592 tokens</tspan></text>
  <text x="520" y="270" fill="#e9eee0" font-size="12">Imagen: <tspan fill="#e8c06a" font-weight="700">~15,4 s</tspan></text>
  <text x="520" y="292" fill="#8d9680" font-size="11">Pico medido: 7.650 MiB · ~300 MiB libres</text>

  <text x="24" y="352" fill="#8d9680" font-size="11">Mismo KV q8_0 en los dos casos: no se pierde precisión, solo se mueve el coste de la imagen a la CPU.</text>
  <text x="24" y="372" fill="#5c6554" font-size="10">Medido 2026-10-30: retrieval PASS a 87.433 tokens reales con 3 agujas al 10/50/90 %; imagen 1200×528 entendida.</text>
</svg>
