<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="MoE offload diagram">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17212b" text-anchor="start">Offload MoE: GPU para atención, CPU/RAM para expertos</text>
<text x="24" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6773" text-anchor="start">GPT-OSS 20B · Qwen3.6 35B-A3B · Qwen3-Coder 30B-A3B · RTX 4060 8 GB + 16 GB RAM</text>
<rect x="60" y="110" width="390" height="350" fill="#f4f8f4" stroke="#2f7d32" stroke-width="2" rx="12"/>
<text x="80" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f7d32" text-anchor="start">GPU · 8 GB VRAM</text>
<rect x="82" y="180" width="346" height="48" fill="#ffffff" stroke="#cfe3d2" rx="7"/>
<text x="96" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">Atención + capas densas</text>
<text x="96" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="start">siempre en GPU</text>
<rect x="82" y="244" width="346" height="48" fill="#ffffff" stroke="#cfe3d2" rx="7"/>
<text x="96" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">KV cache q8_0</text>
<text x="96" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="start">32K / 64K de contexto</text>
<rect x="82" y="308" width="346" height="48" fill="#ffffff" stroke="#cfe3d2" rx="7"/>
<text x="96" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">Expertos calientes</text>
<text x="96" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="start">12/24 · 22/40 · 12/48 capas</text>
<rect x="82" y="372" width="346" height="48" fill="#ffffff" stroke="#cfe3d2" rx="7"/>
<text x="96" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">FlashAttention + CUDA graphs</text>
<text x="96" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="start">batch 1024 · ubatch 512</text>
<rect x="550" y="110" width="390" height="350" fill="#fff8ec" stroke="#d97706" stroke-width="2" rx="12"/>
<text x="570" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#d97706" text-anchor="start">CPU + RAM · 16 GB</text>
<rect x="572" y="180" width="346" height="48" fill="#ffffff" stroke="#f0dcc0" rx="7"/>
<text x="586" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">Expertos fríos</text>
<text x="586" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="start">--n-cpu-moe 12 / 22 / 36</text>
<rect x="572" y="244" width="346" height="48" fill="#ffffff" stroke="#f0dcc0" rx="7"/>
<text x="586" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">Carga</text>
<text x="586" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="start">none si caben; mmap si no</text>
<rect x="572" y="308" width="346" height="48" fill="#ffffff" stroke="#f0dcc0" rx="7"/>
<text x="586" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">Hilos</text>
<text x="586" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="start">8 hilos físicos medidos</text>
<rect x="572" y="372" width="346" height="48" fill="#ffffff" stroke="#f0dcc0" rx="7"/>
<text x="586" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">Resultado</text>
<text x="586" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="start">se combinan en la GPU</text>
<line x1="450" y1="250" x2="550" y2="250" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="550" y1="330" x2="450" y2="330" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs>
<text x="500" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">token</text>
<text x="500" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">expertos</text>
<text x="24" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="start">La VRAM se llena con las últimas capas de expertos; las primeras viven en RAM. Así el modelo grande no se queda en 7 tok/s.</text>
</svg>
