<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="titulo-novedades-21">
  <title id="titulo-novedades-21">Novedades de Bonsai Local IDE 2.1</title>
  <rect width="1100" height="360" fill="#0d100b"/>

  <text x="28" y="40" fill="#e9eee0" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">Bonsai 2.1 · segunda capa</text>
  <text x="28" y="64" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="12.5">Editor, terminal, búsqueda y contratos de herramientas, sin salir del equipo.</text>
  <rect x="962" y="22" width="110" height="30" rx="15" fill="#cde86e"/>
  <text x="1017" y="42" text-anchor="middle" fill="#18200f" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">v2.1.0</text>

  <!-- 01 CodeMirror -->
  <rect x="28" y="92" width="248" height="188" rx="14" fill="#12160f" stroke="#26301f"/>
  <text x="48" y="120" fill="#cde86e" font-family="JetBrains Mono, Consolas, monospace" font-size="10" letter-spacing="0.08em">01 · EDITOR</text>
  <g transform="translate(48 136)" fill="none" stroke="#cde86e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="22" height="18" rx="3"/>
    <path d="M2 8h22M9 8v13"/>
  </g>
  <text x="48" y="178" fill="#e9eee0" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600">Editor real</text>
  <text x="48" y="200" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">CodeMirror 6 local</text>
  <text x="48" y="218" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">undo, multi-cursor, búsqueda,</text>
  <text x="48" y="234" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">plegado y autocompletado.</text>
  <text x="48" y="262" fill="#cde86e" font-family="JetBrains Mono, Consolas, monospace" font-size="10">opt-in · sin CDN</text>

  <!-- 02 xterm -->
  <rect x="300" y="92" width="248" height="188" rx="14" fill="#12160f" stroke="#26301f"/>
  <text x="320" y="120" fill="#82b8d0" font-family="JetBrains Mono, Consolas, monospace" font-size="10" letter-spacing="0.08em">02 · TERMINAL</text>
  <g transform="translate(320 136)" fill="none" stroke="#82b8d0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="22" height="16" rx="3"/>
    <path d="m6 9 3 3-3 3M12 15h5"/>
  </g>
  <text x="320" y="178" fill="#e9eee0" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600">Terminal real</text>
  <text x="320" y="200" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">xterm 6 + ConPTY</text>
  <text x="320" y="218" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">colores, resize y programas</text>
  <text x="320" y="234" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">de pantalla completa.</text>
  <text x="320" y="262" fill="#82b8d0" font-family="JetBrains Mono, Consolas, monospace" font-size="10">fallback por tuberías</text>

  <!-- 03 búsqueda -->
  <rect x="572" y="92" width="248" height="188" rx="14" fill="#12160f" stroke="#26301f"/>
  <text x="592" y="120" fill="#e8c06a" font-family="JetBrains Mono, Consolas, monospace" font-size="10" letter-spacing="0.08em">03 · BÚSQUEDA</text>
  <g transform="translate(592 136)" fill="none" stroke="#e8c06a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="6"/>
    <path d="m15 15 6 6"/>
  </g>
  <text x="592" y="178" fill="#e9eee0" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600">Precisión de código</text>
  <text x="592" y="200" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">ripgrep + ast-grep</text>
  <text x="592" y="218" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">.gitignore, límite 800 KB y</text>
  <text x="592" y="234" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">patrones AST con $X.</text>
  <text x="592" y="262" fill="#e8c06a" font-family="JetBrains Mono, Consolas, monospace" font-size="10">texto + estructura</text>

  <!-- 04 contratos -->
  <rect x="844" y="92" width="228" height="188" rx="14" fill="#12160f" stroke="#26301f"/>
  <text x="864" y="120" fill="#ea9a89" font-family="JetBrains Mono, Consolas, monospace" font-size="10" letter-spacing="0.08em">04 · CONTRATOS</text>
  <g transform="translate(864 136)" fill="none" stroke="#ea9a89" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/>
    <path d="M10 7h4M10 11h4M10 15h4"/>
  </g>
  <text x="864" y="178" fill="#e9eee0" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600">Contratos claros</text>
  <text x="864" y="200" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">Zod + JSON Schema</text>
  <text x="864" y="218" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">llguidance opcional para</text>
  <text x="864" y="234" fill="#8d9680" font-family="Inter, Segoe UI, sans-serif" font-size="11">tool calls estrictas.</text>
  <text x="864" y="262" fill="#ea9a89" font-family="JetBrains Mono, Consolas, monospace" font-size="10">menos reintentos</text>

  <line x1="28" y1="310" x2="1072" y2="310" stroke="#26301f"/>
  <text x="28" y="334" fill="#6f7a64" font-family="Inter, Segoe UI, sans-serif" font-size="10.5">Nuevas dependencias: CodeMirror · xterm · node-pty · ast-grep · ripgrep · Zod · esbuild (dev)</text>
  <text x="1072" y="334" text-anchor="end" fill="#cde86e" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">45 suites · 7 navegador · 0 npm audit</text>
</svg>
