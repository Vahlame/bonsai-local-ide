<svg xmlns="http://www.w3.org/2000/svg" width="820" height="445" viewBox="0 0 820 445" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="820" height="445" fill="#0d100b"/>
  <text x="24" y="34" fill="#e9eee0" font-size="18" font-weight="600">Presets — context window vs KV (RTX 4060 8 GB dedicated)</text>
  <text x="24" y="54" fill="#8d9680" font-size="12">Only real KV types: f16 / q8_0 / q4_0 · ceilings measured with vision + thinking</text>

  <g font-size="10" fill="#8d9680">
    <rect x="520" y="28" width="12" height="12" rx="3" fill="#cde86e"/><text x="538" y="38">f16 / q8_0</text>
    <rect x="620" y="28" width="12" height="12" rx="3" fill="#82b8d0"/><text x="638" y="38">q8_0</text>
    <rect x="690" y="28" width="12" height="12" rx="3" fill="#e8c06a"/><text x="708" y="38">q4_0</text>
  </g>

  <!-- scale 112k across 480px from x=250 -> 4.2857 px per 1k -->
  <line x1="250" y1="380" x2="790" y2="380" stroke="#2c3326"/>
  <g fill="#6f7a64" font-size="10">
    <text x="250" y="396" text-anchor="middle">0</text>
    <text x="370" y="396" text-anchor="middle">28k</text>
    <text x="490" y="396" text-anchor="middle">56k</text>
    <text x="610" y="396" text-anchor="middle">84k</text>
    <text x="730" y="396" text-anchor="middle">112k</text>
  </g>

  <!-- rows -->
  <text x="24" y="92" fill="#e9eee0" font-size="11" font-weight="700">MAX-Q8-100K 110.6k +V ★</text>
  <rect x="250" y="80" width="474" height="16" rx="4" fill="#cde86e"/>
  <text x="732" y="92" fill="#8d9680" font-size="10">7.65 GB</text>

  <text x="24" y="114" fill="#e9eee0" font-size="11" font-weight="700">MAX-Q4 110.6k +V</text>
  <rect x="250" y="102" width="474" height="16" rx="4" fill="#e8c06a"/>
  <text x="732" y="114" fill="#8d9680" font-size="10">7.50 GB</text>

  <text x="24" y="136" fill="#e9eee0" font-size="11" font-weight="700">MAX-Q8 71.7k +V</text>
  <rect x="250" y="124" width="307" height="16" rx="4" fill="#82b8d0"/>
  <text x="565" y="136" fill="#8d9680" font-size="10">7.54 GB</text>

  <text x="24" y="158" fill="#e9eee0" font-size="11">MAX-F16 43k +V</text>
  <rect x="250" y="146" width="184" height="16" rx="4" fill="#cde86e"/>
  <text x="442" y="158" fill="#8d9680" font-size="10">7.48 GB</text>

  <text x="24" y="180" fill="#e9eee0" font-size="11">ULTRA-F16 32k +V</text>
  <rect x="250" y="168" width="137" height="16" rx="4" fill="#cde86e"/>
  <text x="395" y="180" fill="#8d9680" font-size="10">7.16 GB</text>

  <text x="24" y="202" fill="#e9eee0" font-size="11">DEFAULT-F16 16k +V</text>
  <rect x="250" y="190" width="69" height="16" rx="4" fill="#cde86e"/>
  <text x="327" y="202" fill="#8d9680" font-size="10">6.50 GB</text>

  <text x="24" y="224" fill="#e9eee0" font-size="11">HIGH 32k q8_0 +V</text>
  <rect x="250" y="212" width="137" height="16" rx="4" fill="#82b8d0"/>
  <text x="395" y="224" fill="#8d9680" font-size="10">6.70 GB</text>

  <text x="24" y="246" fill="#e9eee0" font-size="11">BALANCED 28k q4_0 +V</text>
  <rect x="250" y="234" width="120" height="16" rx="4" fill="#e8c06a"/>
  <text x="378" y="246" fill="#8d9680" font-size="10">6.30 GB</text>

  <text x="24" y="268" fill="#e9eee0" font-size="11">CODE-MAX 49k q4_0</text>
  <rect x="250" y="256" width="210" height="16" rx="4" fill="#e8c06a"/>
  <text x="468" y="268" fill="#8d9680" font-size="10">5.80 GB</text>

  <text x="24" y="290" fill="#e9eee0" font-size="11">RESEARCH 65.5k q4_0</text>
  <rect x="250" y="278" width="281" height="16" rx="4" fill="#e8c06a"/>
  <text x="539" y="290" fill="#8d9680" font-size="10">5.90 GB</text>

  <text x="24" y="392" fill="#5c6554" font-size="10">★ default (vision projector on CPU). GB values are VRAM-model estimates; ceilings and retrieval are measured (see context-kv.svg).</text>
</svg>
