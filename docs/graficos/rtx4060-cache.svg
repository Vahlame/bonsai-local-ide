<text x="201.0" y="398.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">cold</text>
<rect x="250.0" y="378.7" width="62.0" height="1.3" fill="#2f7d32" rx="4"/>
<text x="281.0" y="370.7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="middle">23 ms</text>
<text x="281.0" y="398.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">warm</text>
<text x="240.0" y="428.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#17212b" text-anchor="middle">Qwen3-4B · 3062-token prefix</text>
<rect x="510.0" y="171.7" width="62.0" height="208.3" fill="#c2410c" rx="4"/>
<text x="541.0" y="163.7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="middle">3,814 ms</text>
<text x="541.0" y="398.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">cold</text>
<rect x="590.0" y="376.1" width="62.0" height="3.9" fill="#2f7d32" rx="4"/>
<text x="621.0" y="368.1" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="middle">72 ms</text>
<text x="621.0" y="398.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#5b6773" text-anchor="middle">warm</text>
<text x="580.0" y="428.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#17212b" text-anchor="middle">GPT-OSS-20B · 3033-token prefix</text>
<text x="24.0" y="445.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6773" text-anchor="start">Measured speedups: Qwen3-4B 43×; GPT-OSS-20B 53×. This is the largest TTFT lever for coding agents, RAG and repeated system prompts.</text>
</svg>