<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-label="Prompt cache: TTFT cold vs warm">
<rect width="900" height="480" fill="#ffffff"/>
<text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17212b">Prompt cache: TTFT cold vs warm</text>
<text x="24.0" y="58.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6773" text-anchor="start">Same prompt twice; cache_prompt=false then true. Chat systems send a large fixed system prompt on every turn.</text>
<line x1="80.0" y1="380.0" x2="820.0" y2="380.0" stroke="#17212b" stroke-width="1.2"/>
<rect x="170.0" y="325.2" width="62.0" height="54.8" fill="#c2410c" rx="4"/>
